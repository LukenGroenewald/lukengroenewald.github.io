<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luken Groenewald</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --muted: #8b949e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 3rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid var(--border);
      margin: 0 auto 1.25rem;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      overflow: hidden;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #e6edf3;
    }

    .handle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 1.25rem;
    }

    .bio {
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 1rem;
      font-size: 0.88rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .links a:hover {
      background: rgba(88, 166, 255, 0.08);
      border-color: var(--accent);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.75rem 0;
    }

    .footer {
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👤</div>
    <h1>Luken Groenewald</h1>
    <p class="handle">@LukenGroenewald</p>
    <p class="bio">Developer &amp; engineer. Building things that matter.</p>

    <div class="links">

</html>
